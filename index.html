<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>

  <link rel="stylesheet" href="styles/rock-paper-scissors.css">
</head>
<body>
  <p>Rock Paper Scissors</p>

  <div>
    <button onclick="
      playGame('rock');
    ">Rock</button>
    <button onclick="
      playGame('paper');
    ">Paper</button>
    <button onclick="
      playGame('scissors');
    ">Scissors</button>
  </div>

  <p class="js-moves"></p>
  <p class="js-result"></p>
  <p class="js-score"></p>

  <div>
    <button onclick="
      resetScore();
    ">Reset score</button>
    <button onclick="
      autoPlay();
    ">Auto play</button>
  </div>
  
  <script src="scripts/rock-paper-scissors.js"></script>
</body>
</html>
