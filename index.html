<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>

  <link rel="stylesheet" href="styles/rock-paper-scissors.css">
</head>
<body>
  <p>Rock Paper Scissors</p>

  <div>
    <button class="js-rock-button">Rock</button>
    <button class="js-paper-button">Paper</button>
    <button class="js-scissors-button">Scissors</button>
  </div>

  <p class="js-moves"></p>
  <p class="js-result"></p>
  <p class="js-score"></p>

  <div>
    <button class="js-reset-score-button">Reset score</button>
    <button class="js-auto-play-button">Auto play</button>
  </div>
  
  <script src="scripts/rock-paper-scissors.js"></script>
</body>
</html>
